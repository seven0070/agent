name: Agent CI/CD Release Pipeline

on:
  push:
    branches: [ main, "feat/*" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test & Audit (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Run Test Suite
        run: |
          pytest tests/

      - name: Run Layer 9 & 10 Verification Scripts
        run: |
          python scripts/verify_layer9.py
          python scripts/verify_layer10.py

  build-backend-executable:
    name: Build Standalone Backend Executable (${{ matrix.platform }})
    needs: [test]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            binary_name: agent-backend-x86_64-pc-windows-msvc.exe
          - os: ubuntu-latest
            platform: linux
            binary_name: agent-backend-x86_64-unknown-linux-gnu

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev] pyinstaller

      - name: Build Standalone Executable via PyInstaller
        run: |
          pyinstaller --onefile --name ${{ matrix.binary_name }} src/agent/api/main.py

      - name: Prepare Tauri Binary Sidecar Directory
        shell: bash
        run: |
          mkdir -p src-tauri/binaries/
          cp dist/${{ matrix.binary_name }} src-tauri/binaries/

      - name: Upload Backend Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-executable-${{ matrix.platform }}
          path: src-tauri/binaries/
          if-no-files-found: error

  build-frontend:
    name: Build Frontend SPA
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: ui/package-lock.json

      - name: Install UI Dependencies & Build SPA
        run: |
          cd ui
          npm ci
          npm run build

      - name: Upload UI Dist Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: ui/dist/
          if-no-files-found: error

  build-tauri:
    name: Build Desktop Application (${{ matrix.platform }})
    needs: [test, build-backend-executable, build-frontend]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: ubuntu-latest
            platform: linux

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: ui/package-lock.json

      - name: Set up Rust
        uses: dslabs/rust-action@v1
        with:
          toolchain: stable

      - name: Download UI Dist Artifact
        uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: ui/dist

      - name: Download Backend Executable Artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-executable-${{ matrix.platform }}
          path: src-tauri/binaries

      - name: Install Linux System Dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Build Tauri Desktop Package
        run: |
          cd ui
          npm ci
          npx tauri build

      - name: Verify Desktop Artifacts & Generate Checksums
        shell: bash
        run: |
          echo "=== Fail-Closed Desktop Artifact Verification ==="
          if [ ! -d "src-tauri/target/release/bundle" ]; then
            echo "ERROR: Tauri target release bundle directory not found!"
            return 1 2>/dev/null || false
          fi
          cd src-tauri/target/release/bundle
          find . -type f \( -name "*.msi" -o -name "*.exe" -o -name "*.deb" -o -name "*.AppImage" \) -exec sha256sum {} \; > CHECKSUMS.sha256
          if [ ! -s CHECKSUMS.sha256 ]; then
            echo "ERROR: No desktop installer artifacts were generated!"
            return 1 2>/dev/null || false
          fi
          cat CHECKSUMS.sha256

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tauri-build-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/
            src-tauri/target/release/*.exe
            src-tauri/target/release/*.msi
          if-no-files-found: error

  create-github-release:
    name: Create GitHub Release
    needs: [build-tauri]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download All Desktop Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/**/*
          draft: false
          prerelease: false
          generate_release_notes: true
