name: Agent CI/CD Release Pipeline

on:
  push:
    branches: [ main, "feat/*" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  test:
    name: Test & Audit (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Test Suite
        run: |
          pytest tests/

      - name: Run Layer Verification Scripts
        run: |
          python scripts/verify_layer9.py
          python scripts/verify_layer10.py
          python scripts/verify_packaging.py

  build-backend-executable:
    name: Build Standalone Backend Executable (${{ matrix.platform }})
    needs: [test]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            triple: x86_64-pc-windows-msvc
          - os: ubuntu-latest
            platform: linux
            triple: x86_64-unknown-linux-gnu

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies & PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" pyinstaller

      - name: Build Standalone Sidecar
        env:
          AGENT_TARGET_TRIPLE: ${{ matrix.triple }}
        run: |
          python scripts/build_backend_sidecar.py --triple ${{ matrix.triple }}

      - name: Verify Sidecar Artifact Exists
        shell: bash
        run: |
          ls -la src-tauri/binaries/
          if [ "${{ matrix.platform }}" = "windows" ]; then
            test -f src-tauri/binaries/agent-backend-${{ matrix.triple }}.exe
          else
            test -f src-tauri/binaries/agent-backend-${{ matrix.triple }}
            test -x src-tauri/binaries/agent-backend-${{ matrix.triple }}
          fi

      - name: Packaged Runtime Smoke (Linux)
        if: matrix.platform == 'linux'
        run: |
          ./src-tauri/binaries/agent-backend-${{ matrix.triple }} --help >/tmp/sidecar-help.txt || true
          ./src-tauri/binaries/agent-backend-${{ matrix.triple }} --port 8099 &
          pid=$!
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8099/health; then
              kill "$pid" || true
              wait "$pid" || true
              exit 0
            fi
            sleep 1
          done
          kill "$pid" || true
          echo "Packaged backend failed health check"
          exit 1

      - name: Upload Backend Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-executable-${{ matrix.platform }}
          path: src-tauri/binaries/
          if-no-files-found: error

  build-frontend:
    name: Build Frontend SPA
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: ui/package-lock.json

      - name: Install UI Dependencies & Build SPA
        run: |
          cd ui
          npm ci
          npm run build

      - name: Upload UI Dist Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: ui/dist/
          if-no-files-found: error

  build-tauri:
    name: Build Desktop Application (${{ matrix.platform }})
    needs: [test, build-backend-executable, build-frontend]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            triple: x86_64-pc-windows-msvc
          - os: ubuntu-latest
            platform: linux
            triple: x86_64-unknown-linux-gnu

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: ui/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Download UI Dist Artifact
        uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: ui/dist

      - name: Download Backend Executable Artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-executable-${{ matrix.platform }}
          path: src-tauri/binaries

      - name: Verify Sidecar Is Where Tauri Expects It
        shell: bash
        run: |
          ls -la src-tauri/binaries/
          if [ "${{ matrix.platform }}" = "windows" ]; then
            test -f "src-tauri/binaries/agent-backend-${{ matrix.triple }}.exe"
          else
            chmod +x "src-tauri/binaries/agent-backend-${{ matrix.triple }}"
            test -x "src-tauri/binaries/agent-backend-${{ matrix.triple }}"
          fi

      - name: Install Linux System Dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Install UI toolchain
        run: npm --prefix ui ci

      - name: Build Tauri Desktop Package
        run: npx --prefix ui tauri build

      - name: Verify Desktop Artifacts & Generate Checksums
        shell: bash
        run: |
          echo "=== Fail-Closed Desktop Artifact Verification ==="
          if [ ! -d "src-tauri/target/release/bundle" ]; then
            echo "ERROR: Tauri target release bundle directory not found!"
            exit 1
          fi
          cd src-tauri/target/release/bundle
          if [ "${{ matrix.platform }}" = "windows" ]; then
            mapfile -t files < <(find . -type f \( -name "*.msi" -o -name "*.exe" \))
          else
            mapfile -t files < <(find . -type f \( -name "*.deb" -o -name "*.AppImage" \))
          fi
          if [ "${#files[@]}" -eq 0 ]; then
            echo "ERROR: No desktop installer artifacts were generated for ${{ matrix.platform }}!"
            find . -type f | head
            exit 1
          fi
          if command -v sha256sum >/dev/null; then
            printf '%s\n' "${files[@]}" | xargs sha256sum > CHECKSUMS.sha256
          else
            printf '%s\n' "${files[@]}" | xargs shasum -a 256 > CHECKSUMS.sha256
          fi
          cat CHECKSUMS.sha256

      - name: Upload Desktop Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: tauri-build-${{ matrix.platform }}
          path: |
            src-tauri/target/release/bundle/
          if-no-files-found: error

  create-github-release:
    name: Create GitHub Release
    needs: [build-tauri]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Desktop Artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: tauri-build-*
          path: release-artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/**/*
          draft: false
          prerelease: false
          generate_release_notes: true
