[package]
name = "sovereign-agent-os"
version = "0.1.0"
description = "Sovereign Agent OS Local Desktop Application"
authors = ["Sovereign Team"]
edition = "2021"

# Isolate this crate from any parent Cargo workspace (e.g. a home-directory
# Cargo.toml). Without this, `cargo metadata` walks up and the Tauri build
# fails before compilation starts.
[workspace]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
reqwest = { version = "0.11", features = ["json"] }
